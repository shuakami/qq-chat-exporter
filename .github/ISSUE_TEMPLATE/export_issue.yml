name: "📤 导出问题"
description: "导出聊天记录时遇到问题"
title: "[导出] "
labels: ["bug", "export"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📤 导出问题反馈
        
        导出遇到问题？我们来帮你看！
        
        > ⚠️ **大量消息导出（>50万条）？** 请使用流式导出功能！
        > 📖 [查看用户手册](https://sdjz.wiki/post/qce%E7%94%A8%E6%88%B7%E6%89%8B%E5%86%8C)
        >
        > 🔒 **提交日志前请先脱敏。** 不要公开 QQ 号、群号、昵称、聊天内容、二维码、WebUI Token、完整本地路径或其他账号凭据。只需提供错误前后必要的少量日志；无法安全提供时，请说明现象即可。

  - type: input
    id: qce-version
    attributes:
      label: "📦 QCE 版本"
      placeholder: "v5.0.0"
    validations:
      required: true

  - type: dropdown
    id: export-format
    attributes:
      label: "📁 导出格式"
      options:
        - "HTML"
        - "JSON"
        - "TXT"
        - "Excel"
    validations:
      required: true

  - type: dropdown
    id: chat-type
    attributes:
      label: "💬 聊天类型"
      options:
        - "群聊"
        - "私聊/好友"
        - "批量导出"
    validations:
      required: true

  - type: input
    id: message-count
    attributes:
      label: "📊 大约消息数量"
      placeholder: "50000"

  - type: textarea
    id: problem
    attributes:
      label: "🤔 发生了什么？"
      placeholder: |
        描述导出问题
        
        比如:
        - 导出卡在 50%
        - 内存溢出 / OOM 错误
        - 消息丢失
        - 图片/视频无法显示
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: "📋 脱敏后的错误信息"
      description: "请只粘贴与故障直接相关的少量日志。删除或替换 QQ 号、群号、昵称、聊天内容、二维码、WebUI Token、完整本地路径及其他凭据；请勿上传完整控制台记录或原始聊天数据。"
      render: shell
      placeholder: |
        粘贴错误前后必要的脱敏日志（无需完整日志）
        
        [ERROR] xxx

  - type: checkboxes
    id: evidence
    attributes:
      label: "📎 日志和截图确认"
      description: "隐私优先：只提交定位问题所需的信息。无法安全提供日志或截图时，请在问题描述中说明，不要勉强公开。"
      options:
        - label: "我已检查并移除日志、截图中的账号凭据、聊天内容、二维码、Token 和可识别个人身份的信息。"
          required: true
        - label: "我仅提供了定位问题所需的日志片段和截图；不适用或无法安全提供的内容已在问题描述中说明。"
          required: true

  - type: checkboxes
    id: export-options
    attributes:
      label: "⚙️ 使用的导出选项"
      description: "勾选你启用的选项"
      options:
        - label: "流式导出（超大消息量专用）"
        - label: "导出为 ZIP 压缩包"
        - label: "快速导出（跳过资源下载）"
        - label: "设置了时间范围"
        - label: "设置了关键词过滤"
        - label: "设置了排除用户"

  - type: dropdown
    id: resource-status
    attributes:
      label: "🖼️ 资源下载情况"
      description: "图片/视频/语音等媒体文件"
      options:
        - "正常下载"
        - "部分缺失"
        - "全部缺失"
        - "跳过了资源下载"
        - "不确定"
