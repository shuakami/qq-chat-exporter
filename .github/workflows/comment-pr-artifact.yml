name: 回帖 PR 构建产物

on:
  workflow_run:
    workflows: [构建 QCE 插件]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment-artifact:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 回帖 Windows 构建产物链接
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let pullRequest = run.pull_requests?.find(({ head }) =>
              head?.sha === run.head_sha
            );

            if (!pullRequest) {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pullRequest = pullRequests.find(({ head }) =>
                head.sha === run.head_sha
              );
            }

            if (!pullRequest) {
              core.info(`No pull request found for ${run.head_sha}`);
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const windowsArtifact = artifacts.artifacts.find(({ name, expired }) =>
              name.startsWith('NapCat-QCE-Windows-x64-') && !expired
            );

            if (!windowsArtifact) {
              core.warning(`No Windows artifact found for run ${run.id}`);
              return;
            }

            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${windowsArtifact.id}`;
            const marker = '<!-- qce-windows-artifact -->';
            const body = [
              marker,
              '## Windows 测试构建已完成',
              '',
              `您可以通过以下链接下载 Windows Shell 测试包：[下载 ZIP 文件](${artifactUrl})。`,
              '',
              `该测试包将保留 7 天。如需查看构建详情，请参阅[工作流运行记录](${run.html_url})。`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find(({ body, user }) =>
              body?.includes(marker) && user?.type === 'Bot'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }
