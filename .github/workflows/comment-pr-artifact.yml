name: 回帖 PR 构建产物

on:
  workflow_run:
    workflows: [构建 QCE 插件, 构建 QCE 安装器 (Tauri / Windows)]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment-artifact:
    if: >-
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 回帖 PR 构建结果
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let pullRequest = run.pull_requests?.find(({ head }) =>
              head?.sha === run.head_sha
            );

            if (!pullRequest) {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pullRequest = pullRequests.find(({ head }) =>
                head.sha === run.head_sha
              );
            }

            if (!pullRequest) {
              core.info(`No pull request found for ${run.head_sha}`);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find(({ body, user }) =>
              body?.includes('<!-- qce-pr-artifacts -->') && user?.type === 'Bot'
            );
            const existingData = existingComment?.body?.match(
              /<!-- qce-pr-artifacts-data: (.+) -->/
            )?.[1];
            const data = existingData
              ? JSON.parse(existingData)
              : { installer: {}, windows: {}, linux: {}, macos: {}, docker: {} };
            const statusText = (conclusion) => {
              if (conclusion === 'success') return '✅ 构建成功';
              if (conclusion === 'failure') return '❌ 构建失败';
              if (conclusion === 'cancelled') return '⚪ 已取消';
              if (conclusion === 'skipped') return '⚪ 未运行';
              return `⚪ ${conclusion || '未完成'}`;
            };
            const runLink = `[查看构建日志](${run.html_url})`;
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const artifactUrl = (artifact) => artifact
              ? `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`
              : undefined;
            const findArtifact = (prefix) => artifacts.artifacts.find(({ name, expired }) =>
              name.startsWith(prefix) && !expired
            );
            const findJob = (predicate) => jobs.jobs.find(predicate);
            const updateResult = (key, job, artifact, extra = {}) => {
              data[key] = {
                status: statusText(job?.conclusion),
                conclusion: job?.conclusion || run.conclusion,
                runUrl: run.html_url,
                artifactUrl: artifactUrl(artifact),
                ...extra,
              };
            };

            if (run.name === '构建 QCE 安装器 (Tauri / Windows)') {
              updateResult(
                'installer',
                findJob(({ name }) => name === 'build-installer'),
                findArtifact('qce-installer-windows')
              );
            } else if (run.name === '构建 QCE 插件') {
              updateResult(
                'windows',
                findJob(({ name }) => name.includes('windows-latest')),
                findArtifact('NapCat-QCE-Windows-x64-')
              );
              updateResult(
                'linux',
                findJob(({ name }) => name.includes('ubuntu-latest') && name.includes('Linux')),
                findArtifact('NapCat-QCE-Linux-x64-')
              );
              updateResult(
                'macos',
                findJob(({ name }) => name.includes('macos-latest')),
                findArtifact('NapCat-QCE-macOS-arm64-')
              );
              const dockerJob = findJob(({ name }) => name === 'build-docker-test-image');
              updateResult('docker', dockerJob, undefined, {
                image: dockerJob?.conclusion === 'success'
                  ? `ghcr.io/${owner}/napcat-qce:pr-${pullRequest.number}-${run.head_sha}`
                  : undefined,
              });
            } else {
              core.info(`Ignoring workflow ${run.name}`);
              return;
            }

            const resultLink = (result, label) => {
              if (result.artifactUrl) return `[下载 ${label}](${result.artifactUrl})`;
              if (result.image) return `镜像：\`${result.image}\``;
              return result.runUrl ? `[查看构建日志](${result.runUrl})` : '暂无详情';
            };
            const body = [
              '<!-- qce-pr-artifacts -->',
              `<!-- qce-pr-artifacts-data: ${JSON.stringify(data)} -->`,
              '## PR 构建结果',
              '',
              '| 构建产物 | 状态 | 下载或详情 |',
              '| --- | --- | --- |',
              `| Windows 一键安装程序（EXE） | ${data.installer.status || '等待构建'} | ${data.installer.status ? resultLink(data.installer, 'EXE 文件') : '等待安装器构建'} |`,
              `| Windows Shell（ZIP） | ${data.windows.status || '等待构建'} | ${data.windows.status ? resultLink(data.windows, 'ZIP 文件') : '等待插件构建'} |`,
              `| Linux（ZIP） | ${data.linux.status || '等待构建'} | ${data.linux.status ? resultLink(data.linux, 'ZIP 文件') : '等待插件构建'} |`,
              `| macOS（ZIP） | ${data.macos.status || '等待构建'} | ${data.macos.status ? resultLink(data.macos, 'ZIP 文件') : '等待插件构建'} |`,
              `| Docker 镜像 | ${data.docker.status || '等待构建'} | ${data.docker.status ? resultLink(data.docker, 'Docker 镜像') : '等待插件构建'} |`,
              '',
              `构建产物将保留 7 天；失败或未运行的项目可通过对应的[工作流运行记录](${run.html_url})查看详情。`,
            ].filter(Boolean).join('\n\n');

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }
