name: 回帖 PR 构建产物

on:
  workflow_run:
    workflows: [构建 QCE 插件, 构建 QCE 安装器 (Tauri / Windows)]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment-artifact:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 回帖 Windows 构建产物链接
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let pullRequest = run.pull_requests?.find(({ head }) =>
              head?.sha === run.head_sha
            );

            if (!pullRequest) {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pullRequest = pullRequests.find(({ head }) =>
                head.sha === run.head_sha
              );
            }

            if (!pullRequest) {
              core.info(`No pull request found for ${run.head_sha}`);
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const isInstallerRun = run.name === '构建 QCE 安装器 (Tauri / Windows)';
            const artifact = artifacts.artifacts.find(({ name, expired }) => {
              if (expired) return false;
              return isInstallerRun
                ? name === 'qce-installer-windows'
                : name.startsWith('NapCat-QCE-Windows-x64-');
            });

            if (!artifact) {
              core.warning(`No Windows artifact found for run ${run.id}`);
              return;
            }

            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find(({ body, user }) =>
              body?.includes('<!-- qce-windows-artifacts -->') && user?.type === 'Bot'
            );
            const existingBody = existingComment?.body ?? '';
            const extractUrl = (key) =>
              existingBody.match(new RegExp(`<!-- ${key}: (https://[^ ]+) -->`))?.[1];
            const installerUrl = isInstallerRun
              ? artifactUrl
              : extractUrl('qce-windows-installer-url');
            const shellUrl = isInstallerRun
              ? extractUrl('qce-windows-shell-url')
              : artifactUrl;
            const body = [
              '<!-- qce-windows-artifacts -->',
              '## Windows 测试构建已完成',
              '',
              installerUrl
                ? `<!-- qce-windows-installer-url: ${installerUrl} -->\n您可以通过以下链接下载 Windows 一键安装程序：[下载 EXE 文件](${installerUrl})。`
                : null,
              shellUrl
                ? `<!-- qce-windows-shell-url: ${shellUrl} -->\n您可以通过以下链接下载 Windows Shell 测试包：[下载 ZIP 文件](${shellUrl})。`
                : null,
              '',
              '测试包将保留 7 天。如需查看构建详情，请参阅[工作流运行记录](' + run.html_url + ')。',
            ].filter(Boolean).join('\n\n');

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }
