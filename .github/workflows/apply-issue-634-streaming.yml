name: Apply issue 634 streaming fix

on:
  push:
    branches: [fix/issue-634-worker-restart-backoff]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-634-worker-restart-backoff
          fetch-depth: 0
      - name: Apply bounded disk streaming refactor
        env:
          PATCH_PAYLOAD: ""
        run: |
          printf '%s' "$PATCH_PAYLOAD" | base64 -d | gzip -d > /tmp/patch_issue_634.py
          python3 /tmp/patch_issue_634.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --manifest-path qq-chat-export-core/Cargo.toml --test disk_streaming
          cargo test --manifest-path qq-chat-export-server/Cargo.toml streaming_spool
          cargo check --manifest-path qq-chat-export-server/Cargo.toml
      - name: Commit generated refactor
        run: |
          rm -f .github/workflows/apply-issue-634-streaming.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- qq-chat-export-core/src/modern_html_exporter.rs qq-chat-export-core/src/json_exporter.rs qq-chat-export-core/tests/disk_streaming.rs qq-chat-export-server/src/api/routes/messages.rs .github/workflows/apply-issue-634-streaming.yml
          git commit -m "fix(streaming): use bounded disk pipeline for large exports"
          git push origin HEAD:fix/issue-634-worker-restart-backoff
