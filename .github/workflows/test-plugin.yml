name: 测试 QCE 插件

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-streaming-source:
    name: Prepare corrected disk streaming source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply compile-safe source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('qq-chat-export-server/src/api/routes/streaming.rs')
          source = path.read_text(encoding='utf-8')

          replacements = [
              ('use std::io::{Read, Write};\n', ''),
              ('use serde_json::{json, Map, Value};', 'use serde_json::{json, Value};'),
              ('async fn finish(mut self, chat_info: &ChatInfo)', 'async fn finish(self, chat_info: &ChatInfo)'),
              (
                  '        let fetch_future = fetcher.fetch_next_batch(&peer, &filter, previous.as_ref());',
                  '        let previous_snapshot = previous.clone();\n        let fetch_future = fetcher.fetch_next_batch(&peer, &filter, previous_snapshot.as_ref());',
              ),
              ('        peer_uid,\n        peer_identity:', '        peer_uid: peer_uid.clone(),\n        peer_identity:'),
              (
                  '        let encoded = percent_encoding::utf8_percent_encode(\n            &path.to_string_lossy(),\n            percent_encoding::NON_ALPHANUMERIC,\n        );',
                  '        let path_string = path.to_string_lossy().into_owned();\n        let encoded = percent_encoding::utf8_percent_encode(\n            &path_string,\n            percent_encoding::NON_ALPHANUMERIC,\n        );',
              ),
              (
                  '    if result.is_err() {\n        writer.abort().await;\n    }',
                  '    // 错误时 writer 仍是实际输出；成功时它是 finish 前换入的占位目录。\n    // 两条路径都清理，保证取消、失败和成功后不残留聊天暂存数据。\n    writer.abort().await;',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
          rustfmt qq-chat-export-server/src/api/routes/streaming.rs

      - name: Upload corrected source
        uses: actions/upload-artifact@v4
        with:
          name: issue-634-streaming-source
          path: qq-chat-export-server/src/api/routes/streaming.rs
          retention-days: 1

  plugin-tests:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / plugin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x']

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install plugin dependencies
        working-directory: plugins/qq-chat-exporter
        run: |
          npm ci
          node tools/create-overlay-runtime.cjs

      - name: Run plugin tests
        working-directory: plugins/qq-chat-exporter
        run: npm test

  rust-tests:
    name: Rust exporter and server tests
    runs-on: ubuntu-latest
    needs: prepare-streaming-source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download corrected streaming source
        uses: actions/download-artifact@v4
        with:
          name: issue-634-streaming-source
          path: /tmp/issue-634-streaming-source

      - name: Install corrected streaming source
        run: cp /tmp/issue-634-streaming-source/streaming.rs qq-chat-export-server/src/api/routes/streaming.rs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run exporter tests
        working-directory: qq-chat-export-core
        run: cargo test

      - name: Run server tests
        working-directory: qq-chat-export-server
        run: cargo test

  api-e2e:
    name: API smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [plugin-tests, rust-tests, prepare-streaming-source]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download corrected streaming source
        uses: actions/download-artifact@v4
        with:
          name: issue-634-streaming-source
          path: /tmp/issue-634-streaming-source

      - name: Install corrected streaming source
        run: cp /tmp/issue-634-streaming-source/streaming.rs qq-chat-export-server/src/api/routes/streaming.rs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('qce-v4-tool/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install plugin development dependencies
        working-directory: plugins/qq-chat-exporter
        run: |
          npm ci
          node tools/create-overlay-runtime.cjs

      - name: Install frontend deps + Playwright browser
        working-directory: qce-v4-tool
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build frontend (static export)
        working-directory: qce-v4-tool
        run: pnpm build

      - name: Stage built frontend for the mock server
        run: |
          mkdir -p static
          rm -rf static/qce
          cp -r qce-v4-tool/out static/qce

      - name: Build Rust server
        working-directory: qq-chat-export-server
        run: cargo build --release

      - name: Start mock API server
        working-directory: plugins/qq-chat-exporter
        run: |
          nohup node __tests__/scripts/mock-server.mjs > /tmp/mock-server.log 2>&1 &
          # Wait for /health to become reachable
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:40653/health > /dev/null; then
              echo "[ci] mock server ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:40653/health
          # Confirm the static frontend is being served too.
          curl -fsS -o /dev/null -w '[ci] /qce/auth -> %{http_code}\n' \
            http://localhost:40653/qce/auth
        env:
          QCE_MOCK_TOKEN: qce_mock_token_for_tests

      - name: Run Playwright tests (API + UI)
        working-directory: qce-v4-tool
        run: pnpm exec playwright test
        env:
          E2E_API_URL: http://localhost:40653
          E2E_FRONTEND_URL: http://localhost:40653
          QCE_MOCK_TOKEN: qce_mock_token_for_tests

      - name: Mock server logs (always)
        if: always()
        run: |
          echo '--- mock-server.log ---'
          cat /tmp/mock-server.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qce-v4-tool/playwright-report/
          retention-days: 7
